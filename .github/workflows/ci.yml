name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — seed + integration tests
    runs-on: ubuntu-latest

    # Run Elasticsearch as a service container. The job waits for its health
    # check to pass before any step runs.
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.license.self_generated.type: basic
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:9200/_cluster/health | grep -q '"status":"\(green\|yellow\)"'; then
              echo "Elasticsearch is up"; exit 0
            fi
            echo "waiting for Elasticsearch..."; sleep 5
          done
          echo "Elasticsearch did not become ready"; exit 1

      - name: Seed index
        working-directory: api
        run: npm run seed

      - name: Run integration tests
        working-directory: api
        run: npm test

  web:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build Angular app
        working-directory: web
        run: npm run build -- --configuration production
